<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Atendimento — Hospital Hello Kitty</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap"
      rel="stylesheet">


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  min-height: 100vh;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 25px 15px;

  font-family: 'Nunito', sans-serif;

  background:

    radial-gradient(
      circle at 10% 15%,
      #ffffff 0 4px,
      transparent 5px
    ),

    radial-gradient(
      circle at 85% 20%,
      #ffffff 0 5px,
      transparent 6px
    ),

    radial-gradient(
      circle at 20% 80%,
      #ffffff 0 4px,
      transparent 5px
    ),

    radial-gradient(
      circle at 90% 75%,
      #ffffff 0 3px,
      transparent 4px
    ),

    linear-gradient(
      135deg,
      #ffd9e8,
      #fff3f8
    );

  background-size:
    110px 110px,
    140px 140px,
    90px 90px,
    120px 120px,
    cover;
}


/* CONTAINER */

.container {

  width: 100%;

  max-width: 850px;

  padding: 35px 32px 30px;

  background: rgba(255,255,255,.97);

  border: 4px solid #ff9fbe;

  border-radius: 30px;

  box-shadow:

    0 15px 35px
    rgba(214,91,132,.22),

    0 5px 0
    #ffb8cf;

  text-align: center;

  position: relative;
}


/* LAÇOS */

.container::before,
.container::after {

  content: "🎀";

  position: absolute;

  top: -27px;

  font-size: 42px;

  filter:
    drop-shadow(
      2px 3px 2px
      rgba(0,0,0,.12)
    );
}


.container::before {
  left: 20px;
}


.container::after {
  right: 20px;
}


/* ÍCONE */

.icone {

  width: 80px;

  height: 80px;

  margin: 0 auto 15px;

  display: flex;

  align-items: center;

  justify-content: center;

  background: #ffe5ef;

  border: 3px solid #ffabc6;

  border-radius: 50%;

  font-size: 40px;

  box-shadow:
    0 5px 0 #ffc5d8;
}


/* TÍTULO */

h2 {

  margin: 0;

  color: #e83f78;

  font-size: 27px;

  font-weight: 900;

  text-shadow:
    1px 2px 0 #ffd1e0;
}


.subtitulo {

  margin-top: 5px;

  margin-bottom: 25px;

  color: #c97895;

  font-size: 13px;

  font-weight: 600;
}


/* SEÇÕES */

.secao {

  margin: 22px 0 15px;

  padding: 10px 14px;

  background: #ffe8f1;

  border: 2px solid #ffc4d8;

  border-radius: 15px;

  color: #d83d70;

  font-size: 15px;

  font-weight: 900;

  text-align: left;

  grid-column: 1 / -1;
}


/* GRID */

.form-grid {

  display: grid;

  grid-template-columns: 1fr 1fr;

  column-gap: 15px;

  row-gap: 0;

  text-align: left;
}


/* CAMPOS */

.campo {

  text-align: left;

  margin-bottom: 13px;
}


.campo label {

  display: block;

  margin: 0 0 6px 5px;

  color: #a84968;

  font-size: 13px;

  font-weight: 800;
}


input,
select,
textarea {

  width: 100%;

  min-height: 48px;

  padding: 11px 15px;

  border: 2px solid #ffc1d5;

  border-radius: 17px;

  background: #fff8fb;

  color: #8b3b59;

  font-family: 'Nunito', sans-serif;

  font-size: 14px;

  outline: none;

  transition: .2s;
}


textarea {

  min-height: 85px;

  resize: vertical;
}


input::placeholder,
textarea::placeholder {

  color: #d49aad;
}


input:focus,
select:focus,
textarea:focus {

  border-color: #f36d9a;

  background: white;

  box-shadow:
    0 0 0 4px
    rgba(243,109,154,.10);
}


/* CAMPO GRANDE */

.campo-full {

  grid-column: 1 / -1;
}


/* FOTO */

.foto-box {

  padding: 15px;

  background: #fff4f8;

  border: 2px dashed #ffabc6;

  border-radius: 17px;

  text-align: left;

  margin: 5px 0 18px;
}


.foto-titulo {

  color: #d83d70;

  font-size: 13px;

  font-weight: 800;

  margin-bottom: 8px;
}


.foto-box input {

  height: auto;

  padding: 8px;

  background: white;

  border: 1px solid #ffc5d8;

  font-size: 13px;
}


/* BOTÃO */

button {

  width: 100%;

  height: 53px;

  margin-top: 5px;

  border: none;

  border-radius: 19px;

  background:
    linear-gradient(
      135deg,
      #f45183,
      #e93670
    );

  color: white;

  font-family: 'Nunito', sans-serif;

  font-size: 17px;

  font-weight: 900;

  cursor: pointer;

  box-shadow:
    0 5px 0 #bd2859;

  transition: .15s;
}


button:hover {

  transform:
    translateY(-2px);

  box-shadow:
    0 7px 0 #bd2859;

  background:
    linear-gradient(
      135deg,
      #ff5d91,
      #ed3c76
    );
}


button:active {

  transform:
    translateY(3px);

  box-shadow:
    0 2px 0 #bd2859;
}


/* MENSAGEM */

#mensagem {

  display: none;

  margin-top: 18px;

  padding: 12px;

  border-radius: 15px;

  background: #e5f8ec;

  border: 2px solid #a6dfb6;

  color: #218838;

  font-size: 13px;

  font-weight: 800;
}


/* RODAPÉ */

.rodape {

  margin-top: 20px;

  color: #d28aa2;

  font-size: 12px;

  font-weight: 600;
}


.coracao {

  color: #ed477d;
}


/* CELULAR */

@media (max-width: 650px) {

  .container {

    max-width: 430px;

    padding: 30px 22px 25px;
  }


  .form-grid {

    grid-template-columns: 1fr;
  }


  .campo-full {

    grid-column: auto;
  }


  .secao {

    grid-column: auto;
  }


  h2 {

    font-size: 23px;
  }


  .icone {

    width: 70px;

    height: 70px;

    font-size: 34px;
  }

}

</style>

</head>


<body>


<div class="container">


  <!-- CABEÇALHO -->

  <div class="icone">
    🏥
  </div>


  <h2>
    🎀 Atendimento
  </h2>


  <div class="subtitulo">

    Hospital Hello Kitty • Recepção

  </div>


  <!-- =========================
       DADOS DO PACIENTE
  ========================== -->

  <div class="form-grid">

    <div class="secao">
      👤 Dados do paciente
    </div>


    <div class="campo">

      <label>👤 Nome completo</label>

      <input
        id="nome"
        placeholder="Digite o nome completo"
        autocomplete="name"
      >

    </div>


    <div class="campo">

      <label>🪪 CPF</label>

      <input
        id="cpf"
        placeholder="Digite o CPF"
        maxlength="14"
        inputmode="numeric"
      >

    </div>


    <div class="campo">

      <label>🎂 Data de nascimento</label>

      <input
        id="nascimento"
        type="date"
      >

    </div>


    <div class="campo">

      <label>⚧ Sexo</label>

      <select id="sexo">

        <option value="">
          Selecione
        </option>

        <option value="Feminino">
          👩 Feminino
        </option>

        <option value="Masculino">
          👨 Masculino
        </option>

        <option value="Outro">
          💗 Outro
        </option>

        <option value="Nao informado">
          Prefiro não informar
        </option>

      </select>

    </div>


    <div class="campo">

      <label>💍 Estado civil</label>

      <select id="estadoCivil">

        <option value="">
          Selecione
        </option>

        <option>Solteiro(a)</option>
        <option>Casado(a)</option>
        <option>Divorciado(a)</option>
        <option>Viúvo(a)</option>
        <option>União estável</option>

      </select>

    </div>


    <div class="campo">

      <label>📱 Telefone</label>

      <input
        id="telefone"
        type="tel"
        placeholder="(00) 00000-0000"
      >

    </div>


    <!-- =========================
         CONTATO E ENDEREÇO
    ========================== -->

    <div class="secao">
      📱 Contato e endereço
    </div>


    <div class="campo">

      <label>📧 E-mail</label>

      <input
        id="email"
        type="email"
        placeholder="Digite o e-mail"
      >

    </div>


    <div class="campo">

      <label>🏠 CEP</label>

      <input
        id="cep"
        placeholder="00000-000"
        maxlength="9"
        inputmode="numeric"
      >

    </div>


    <div class="campo">

      <label>🛣️ Endereço</label>

      <input
        id="endereco"
        placeholder="Rua, avenida..."
      >

    </div>


    <div class="campo">

      <label>🔢 Número</label>

      <input
        id="numero"
        placeholder="Número"
      >

    </div>


    <div class="campo">

      <label>📍 Complemento</label>

      <input
        id="complemento"
        placeholder="Apto, bloco, casa..."
      >

    </div>


    <div class="campo">

      <label>🌸 Bairro</label>

      <input
        id="bairro"
        placeholder="Digite o bairro"
      >

    </div>


    <div class="campo">

      <label>🏙️ Cidade</label>

      <input
        id="cidade"
        placeholder="Digite a cidade"
      >

    </div>


    <div class="campo">

      <label>🗺️ Estado</label>

      <select id="estado">

        <option value="">
          Selecione
        </option>

        <option>AC</option>
        <option>AL</option>
        <option>AP</option>
        <option>AM</option>
        <option>BA</option>
        <option>CE</option>
        <option>DF</option>
        <option>ES</option>
        <option>GO</option>
        <option>MA</option>
        <option>MT</option>
        <option>MS</option>
        <option>MG</option>
        <option>PA</option>
        <option>PB</option>
        <option>PR</option>
        <option>PE</option>
        <option>PI</option>
        <option>RJ</option>
        <option>RN</option>
        <option>RS</option>
        <option>RO</option>
        <option>RR</option>
        <option>SC</option>
        <option>SP</option>
        <option>SE</option>
        <option>TO</option>

      </select>

    </div>


    <!-- =========================
         RESPONSÁVEL
    ========================== -->

    <div class="secao">
      👨‍👩‍👧 Responsável / emergência
    </div>


    <div class="campo">

      <label>👥 Nome do responsável</label>

      <input
        id="responsavel"
        placeholder="Nome completo"
      >

    </div>


    <div class="campo">

      <label>🤝 Parentesco</label>

      <select id="parentesco">

        <option value="">
          Selecione
        </option>

        <option>Mãe</option>
        <option>Pai</option>
        <option>Filho(a)</option>
        <option>Cônjuge</option>
        <option>Irmão(ã)</option>
        <option>Avô/Avó</option>
        <option>Responsável legal</option>
        <option>Outro</option>

      </select>

    </div>


    <div class="campo">

      <label>📞 Telefone de emergência</label>

      <input
        id="telefoneEmergencia"
        type="tel"
        placeholder="(00) 00000-0000"
      >

    </div>


    <!-- =========================
         CONVÊNIO
    ========================== -->

    <div class="secao">
      💳 Convênio e pagamento
    </div>


    <div class="campo">

      <label>💗 Tipo de atendimento</label>

      <select id="tipo">

        <option value="Convenio">
          🩷 Convênio
        </option>

        <option value="Particular">
          💕 Particular
        </option>

      </select>

    </div>


    <div class="campo">

      <label>🏥 Nome do convênio</label>

      <input
        id="convenio"
        placeholder="Nome do convênio"
      >

    </div>


    <div class="campo">

      <label>💳 Nº da carteirinha</label>

      <input
        id="carteirinha"
        placeholder="Número da carteirinha"
      >

    </div>


    <div class="campo">

      <label>📅 Validade</label>

      <input
        id="validadeConvenio"
        type="date"
      >

    </div>


    <!-- =========================
         SAÚDE
    ========================== -->

    <div class="secao">
      🩺 Informações de saúde
    </div>


    <div class="campo">

      <label>🩸 Tipo sanguíneo</label>

      <select id="tipoSanguineo">

        <option value="">
          Selecione
        </option>

        <option>A+</option>
        <option>A-</option>
        <option>B+</option>
        <option>B-</option>
        <option>AB+</option>
        <option>AB-</option>
        <option>O+</option>
        <option>O-</option>

      </select>

    </div>


    <div class="campo">

      <label>💊 Alergias</label>

      <input
        id="alergias"
        placeholder="Alergias conhecidas"
      >

    </div>


    <div class="campo">

      <label>💉 Medicamentos</label>

      <input
        id="medicamentos"
        placeholder="Medicamentos em uso"
      >

    </div>


    <div class="campo">

      <label>🩺 Doenças preexistentes</label>

      <input
        id="doencas"
        placeholder="Condições de saúde"
      >

    </div>


    <div class="campo campo-full">

      <label>🏥 Histórico cirúrgico</label>

      <input
        id="cirurgias"
        placeholder="Cirurgias anteriores"
      >

    </div>


    <!-- =========================
         ATENDIMENTO
    ========================== -->

    <div class="secao">
      🩷 Dados do atendimento
    </div>


    <div class="campo">

      <label>🚑 Especialidade</label>

      <select id="especialidade">

        <option value="">
          Selecione
        </option>

        <option>Pronto atendimento</option>
        <option>Consulta médica</option>
        <option>Pediatria</option>
        <option>Clínica geral</option>
        <option>Cardiologia</option>
        <option>Dermatologia</option>
        <option>Ginecologia</option>
        <option>Ortopedia</option>
        <option>Odontologia</option>
        <option>Exames</option>
        <option>Retorno</option>
        <option>Outro</option>

      </select>

    </div>


    <div class="campo">

      <label>🕐 Data do atendimento</label>

      <input
        id="dataAtendimento"
        type="date"
      >

    </div>


    <div class="campo">

      <label>🚨 Prioridade</label>

      <select id="prioridade">

        <option value="Normal">
          💗 Normal
        </option>

        <option value="Baixa">
          🩷 Baixa
        </option>

        <option value="Urgente">
          🧡 Urgente
        </option>

        <option value="Emergencia">
          ❤️ Emergência
        </option>

      </select>

    </div>


    <div class="campo">

      <label>🩺 Motivo da consulta</label>

      <input
        id="motivo"
        placeholder="Motivo principal"
      >

    </div>


    <div class="campo campo-full">

      <label>🌡️ Sintomas / queixas</label>

      <textarea
        id="sintomas"
        placeholder="Descreva os sintomas do paciente"
      ></textarea>

    </div>


    <div class="campo campo-full">

      <label>📝 Observações</label>

      <textarea
        id="observacoes"
        placeholder="Informações adicionais"
      ></textarea>

    </div>

  </div>


  <!-- FOTO -->

  <div class="foto-box">

    <div class="foto-titulo">
      📷 Foto do paciente
    </div>

    <input
      type="file"
      id="foto"
      accept="image/*"
    >

  </div>


  <!-- BOTÃO -->

  <button onclick="cadastrar()">

    💗 Cadastrar Paciente

  </button>


  <!-- MENSAGEM -->

  <div id="mensagem">

    ✅ Paciente enviado para a triagem!

  </div>


  <!-- RODAPÉ -->

  <div class="rodape">

    Cuidando com carinho
    <span class="coracao">♥</span>
    Hospital Hello Kitty

  </div>


</div>


<script>


function cadastrar() {

  const nome =
    document.getElementById("nome").value;

  const cpf =
    document.getElementById("cpf").value;


  if (!nome.trim()) {

    alert(
      "🎀 Digite o nome do paciente."
    );

    return;
  }


  if (!cpf.trim()) {

    alert(
      "🪪 Digite o CPF do paciente."
    );

    return;
  }


  const paciente = {

    nome:
      document.getElementById("nome").value,

    cpf:
      document.getElementById("cpf").value,

    nascimento:
      document.getElementById("nascimento").value,

    sexo:
      document.getElementById("sexo").value,

    estadoCivil:
      document.getElementById("estadoCivil").value,

    telefone:
      document.getElementById("telefone").value,

    email:
      document.getElementById("email").value,

    cep:
      document.getElementById("cep").value,

    endereco:
      document.getElementById("endereco").value,

    numero:
      document.getElementById("numero").value,

    complemento:
      document.getElementById("complemento").value,

    bairro:
      document.getElementById("bairro").value,

    cidade:
      document.getElementById("cidade").value,

    estado:
      document.getElementById("estado").value,

    responsavel:
      document.getElementById("responsavel").value,

    parentesco:
      document.getElementById("parentesco").value,

    telefoneEmergencia:
      document.getElementById("telefoneEmergencia").value,

    tipo:
      document.getElementById("tipo").value,

    convenio:
      document.getElementById("convenio").value,

    carteirinha:
      document.getElementById("carteirinha").value,

    validadeConvenio:
      document.getElementById("validadeConvenio").value,

    tipoSanguineo:
      document.getElementById("tipoSanguineo").value,

    alergias:
      document.getElementById("alergias").value,

    medicamentos:
      document.getElementById("medicamentos").value,

    doencas:
      document.getElementById("doencas").value,

    cirurgias:
      document.getElementById("cirurgias").value,

    especialidade:
      document.getElementById("especialidade").value,

    dataAtendimento:
      document.getElementById("dataAtendimento").value,

    prioridade:
      document.getElementById("prioridade").value,

    motivo:
      document.getElementById("motivo").value,

    sintomas:
      document.getElementById("sintomas").value,

    observacoes:
      document.getElementById("observacoes").value

  };


  fetch(
    "http://localhost:3000/atendimento",
    {

      method: "POST",

      headers: {
        "Content-Type":
          "application/json"
      },

      body:
        JSON.stringify(paciente)

    }
  )


  .then(r => {

    if (!r.ok) {

      throw new Error(
        "Erro no cadastro"
      );

    }

    return r.json();

  })


  .then(() => {

    document.getElementById(
      "mensagem"
    ).style.display = "block";


    alert(
      "💗 Paciente enviado para triagem!"
    );


    document.querySelectorAll(
      "input, textarea"
    ).forEach(campo => {

      if (campo.type !== "file") {

        campo.value = "";

      }

    });


    document.querySelectorAll(
      "select"
    ).forEach(select => {

      select.selectedIndex = 0;

    });


    document.getElementById(
      "tipo"
    ).value = "Convenio";


    document.getElementById(
      "prioridade"
    ).value = "Normal";


    document.getElementById(
      "foto"
    ).value = "";

  })


  .catch(error => {

    console.error(error);

    alert(
      "❌ Não foi possível cadastrar o paciente."
    );

  });

}

</script>


</body>

</html>
